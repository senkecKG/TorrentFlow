stages:
  - pages
  - release

pages:
  stage: pages
  image: alpine:latest
  script:
    - mkdir -p public
    - cp -r docs/. public/
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-release:
  stage: release
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  script:
    - Invoke-WebRequest "https://nodejs.org/dist/v20.19.0/node-v20.19.0-win-x64.zip" -OutFile node.zip
    - Expand-Archive node.zip -DestinationPath node
    - $env:PATH = "$PWD\node\node-v20.19.0-win-x64;$env:PATH"
    - Invoke-WebRequest "https://win.rustup.rs/x86_64" -OutFile rustup-init.exe
    - .\rustup-init.exe -y --default-toolchain stable --profile minimal
    - $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"
    - npm ci
    - npm run tauri build
    - $installer = Get-ChildItem "src-tauri\target\release\bundle\nsis\*-setup.exe" | Select-Object -First 1
    - |
      curl.exe --silent --show-error --fail `
        --header "JOB-TOKEN: $CI_JOB_TOKEN" `
        --upload-file $installer.FullName `
        "$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/torrentflow/$env:CI_COMMIT_TAG/$($installer.Name)"
    - release-cli create --name "TorrentFlow $env:CI_COMMIT_TAG" --tag-name $env:CI_COMMIT_TAG `
        --description "Windows x64 installer (NSIS)." `
        --assets-link "{\"name\":\"$($installer.Name)\",\"url\":\"$env:CI_API_V4_URL/projects/$env:CI_PROJECT_ID/packages/generic/torrentflow/$env:CI_COMMIT_TAG/$($installer.Name)\"}"
